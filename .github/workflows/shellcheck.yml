name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        env:
          # error-level only: catches the real traps (unquoted vars that don't
          # word-split, bad IFS handling) without drowning the run in style noise.
          SHELLCHECK_OPTS: -S error -s bash
        with:
          additional_files: tmux-ai-necromancer.tmux

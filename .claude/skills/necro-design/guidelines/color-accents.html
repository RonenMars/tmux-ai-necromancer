<!-- @dsCard group="Colors" viewport="700x180" name="Accent Ramps" subtitle="Azure circuit & signal red" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-mono);padding:24px}
  .grp{margin-bottom:14px}
  .ttl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
  .row{display:flex;gap:0}
  .sw{flex:1;text-align:center}
  .chip{height:46px}
  .lab{font-size:11px;color:var(--text-muted);margin-top:6px}
</style></head><body>
  <div class="grp"><div class="ttl">Azure Circuit</div><div class="row">
    <div class="sw"><div class="chip" style="background:var(--azure-300);border-radius:6px 0 0 6px"></div><div class="lab">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--azure-500)"></div><div class="lab">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--azure-700);border-radius:0 6px 6px 0"></div><div class="lab">700</div></div>
  </div></div>
  <div class="grp"><div class="ttl">Signal Red</div><div class="row">
    <div class="sw"><div class="chip" style="background:var(--red-400);border-radius:6px 0 0 6px"></div><div class="lab">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-500)"></div><div class="lab">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--red-700);border-radius:0 6px 6px 0"></div><div class="lab">700</div></div>
  </div></div>
</body></html>

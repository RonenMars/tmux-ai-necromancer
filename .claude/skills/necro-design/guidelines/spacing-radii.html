<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-base);padding:26px;font-family:var(--font-mono);display:flex;gap:22px;align-items:flex-end}
  .b{text-align:center}
  .box{width:84px;height:60px;background:var(--surface-raised);border:1px solid var(--border-green)}
  .lab{font-size:11px;color:var(--text-muted);margin-top:8px}
</style></head><body>
  <div class="b"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lab">xs · 2</div></div>
  <div class="b"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm · 4</div></div>
  <div class="b"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md · 6</div></div>
  <div class="b"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg · 10</div></div>
  <div class="b"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl · 14</div></div>
  <div class="b"><div class="box" style="border-radius:var(--radius-pill);width:60px"></div><div class="lab">pill</div></div>
</body></html>

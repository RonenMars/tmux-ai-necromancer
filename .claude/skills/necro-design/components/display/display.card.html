<body>
<div id="root"></div>
<script type="text/babel">
const { Badge, KeyCombo, KeyCap } = window.DesignSystem_7d9b63;
function Demo() {
  return (
    <div>
      <div className="row">
        <Badge tone="alive" dot pulse>Restoring</Badge>
        <Badge tone="data" dot>Snapshot</Badge>
        <Badge tone="dead" dot>Crashed</Badge>
        <Badge tone="dormant">Idle</Badge>
      </div>
      <div className="row">
        <KeyCombo keys={[{label:'Prefix'},{label:'a',tone:'green'},{label:'i',tone:'green'}]} />
        <KeyCombo keys={[{label:'Prefix'},{label:'I',tone:'azure'}]} />
      </div>
      <div className="row">
        <KeyCap size="lg" tone="green">R</KeyCap>
        <KeyCap size="lg">Prefix</KeyCap>
        <KeyCap size="lg" tone="azure">c</KeyCap>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);

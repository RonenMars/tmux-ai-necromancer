<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows & Glows" subtitle="Elevation + the signature reanimation glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-base);padding:30px;font-family:var(--font-mono);display:flex;gap:26px;flex-wrap:wrap}
  .b{text-align:center}
  .box{width:96px;height:56px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px}
  .lab{font-size:11px;color:var(--text-muted);margin-top:12px}
</style></head><body>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">shadow-md</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">shadow-lg</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--glow-green-md);border-color:var(--border-green)"></div><div class="lab">glow-green</div></div>
  <div class="b"><div class="box" style="box-shadow:var(--glow-azure-md);border-color:var(--border-azure)"></div><div class="lab">glow-azure</div></div>
</body></html>

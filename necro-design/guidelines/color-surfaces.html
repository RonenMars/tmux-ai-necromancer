<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-mono);padding:24px;display:flex;gap:0}
  .sw{flex:1;text-align:center}
  .chip{height:70px;border:1px solid var(--border-subtle)}
  .lab{font-size:10px;color:var(--text-muted);margin-top:6px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--void-950);border-radius:6px 0 0 6px"></div><div class="lab">950</div></div>
  <div class="sw"><div class="chip" style="background:var(--void-900)"></div><div class="lab">900</div></div>
  <div class="sw"><div class="chip" style="background:var(--void-800)"></div><div class="lab">800</div></div>
  <div class="sw"><div class="chip" style="background:var(--void-750)"></div><div class="lab">750</div></div>
  <div class="sw"><div class="chip" style="background:var(--void-700)"></div><div class="lab">700</div></div>
  <div class="sw"><div class="chip" style="background:var(--void-600)"></div><div class="lab">600</div></div>
  <div class="sw"><div class="chip" style="background:var(--void-500);border-radius:0 6px 6px 0"></div><div class="lab">500</div></div>
</body></html>

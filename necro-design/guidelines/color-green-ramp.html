<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-mono);padding:24px;display:flex;gap:0}
  .sw{flex:1;text-align:center}
  .chip{height:64px}
  .lab{font-size:11px;color:var(--text-muted);margin-top:8px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--green-100);border-radius:6px 0 0 6px"></div><div class="lab">100</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-300)"></div><div class="lab">300</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-500)"></div><div class="lab">500</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-600)"></div><div class="lab">600</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-700)"></div><div class="lab">700</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-900);border-radius:0 6px 6px 0"></div><div class="lab">900</div></div>
</body></html>

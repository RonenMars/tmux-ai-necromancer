<!-- @dsCard group="Colors" viewport="700x190" name="Brand Core" subtitle="The five named brand colors from the asset sheet" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-base);font-family:var(--font-body);padding:24px;display:flex;gap:18px;flex-wrap:wrap}
  .sw{flex:1;min-width:110px}
  .chip{height:74px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
  .name{font-family:var(--font-display);font-weight:700;color:var(--text-primary);font-size:13px;margin-top:10px}
  .hex{font-family:var(--font-mono);color:var(--text-muted);font-size:12px;margin-top:2px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:#00ff8c;box-shadow:var(--glow-green-md)"></div><div class="name">Necromancer Green</div><div class="hex">#00ff8c</div></div>
  <div class="sw"><div class="chip" style="background:#0a0a14"></div><div class="name">Midnight Void</div><div class="hex">#0a0a14</div></div>
  <div class="sw"><div class="chip" style="background:#00d4ff;box-shadow:var(--glow-azure-sm)"></div><div class="name">Azure Circuit</div><div class="hex">#00d4ff</div></div>
  <div class="sw"><div class="chip" style="background:#aaaaaa"></div><div class="name">Ash Gray</div><div class="hex">#aaaaaa</div></div>
  <div class="sw"><div class="chip" style="background:#ff4d4d"></div><div class="name">Signal Red</div><div class="hex">#ff4d4d</div></div>
</body></html>

<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg-base);padding:24px;font-family:var(--font-mono)}
  .r{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .bar{height:16px;background:var(--necro-green);border-radius:2px;opacity:.85}
  .lab{font-size:11px;color:var(--text-muted);width:90px;flex:none}
</style></head><body>
  <div class="r"><span class="lab">1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="r"><span class="lab">2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="lab">4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="lab">5 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="r"><span class="lab">6 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="lab">8 · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="r"><span class="lab">9 · 64px</span><div class="bar" style="width:64px"></div></div>
</body></html>
